    if(ta==='plan'&&tb==='plan'||(!ta&&tb==='plan')||(!tb&&ta==='plan'))w=.2;
    edges.push({pts:dx?seg(x+1,y,x+1,y+1,3):seg(x,y+1,x+1,y+1,3),w,ring,wall,main,v:dx,x:x+dx,y:y+dy});}}
for(const e of edges)line(e.pts,e.w,STREET);
// chamfered corners where the new streets cross
if(MOD)for(let y=1;y<H;y++)for(let x=1;x<W;x++){if((x-OX)%STEP||(y-OY)%STEP)continue;const ks=[K(x-1,y-1),K(x,y-1),K(x-1,y),K(x,y)];
  if(!ks.every(k=>['grid','works','market','hospital'].includes(T(k)))||new Set(ks.map(k=>id[k])).size<4)continue;const [px,py]=warp(x,y),r=.36;poly([[px-r,py],[px,py-r],[px+r,py],[px,py+r]]);g.fillStyle=STREET;g.fill();}
// The wall follows the edge of the old town; in the modern plan the same line is a tree-lined boulevard.
const N=96,rad=[];for(let i=0;i<N;i++){const a=i/N*Math.PI*2;let r=1;for(let t=1;t<RC+5;t+=.2){const x=Math.floor(OX+Math.cos(a)*t),y=Math.floor(OY+Math.sin(a)*t);if(inMap(x,y)&&kind[K(x,y)]==='core'&&dVil(x,y)>VR+1)r=t;}rad.push(r+.55);}
let sm=rad;for(let p=0;p<4;p++)sm=sm.map((v,i)=>(sm[(i+N-1)%N]+2*v+sm[(i+1)%N])/4);
const wallPts=sm.map((r,i)=>{const a=i/N*Math.PI*2,x=OX+Math.cos(a)*r,y=OY+Math.sin(a)*r;return warp(Math.min(x,riverX(y)-3.3),y);});wallPts.push(wallPts[0]);
if(MOD){line(wallPts,.8,'rgba(90,70,52,.5)');line(wallPts,.68,STREET);wallPts.forEach(([x,y],i)=>{if(i%2)return;const b=wallPts[(i+1)%N],L=Math.hypot(b[0]-x,b[1]-y)||1,nx=-(b[1]-y)/L,ny=(b[0]-x)/L;for(const s2 of [-.2,.2])dot(x+nx*s2,y+ny*s2,.09,'#6f8a5f');});}
else{line(wallPts,.34,'#5f4c3a');line(wallPts,.12,'#9c8466');wallPts.forEach(([x,y],i)=>{if(i%6===3)dot(x,y,.27,'#5f4c3a');});
  for(const i of [0,N/4,N/2,3*N/4]){const [x,y]=wallPts[i];g.fillStyle='#4d3d2f';g.fillRect(x-.34,y-.34,.68,.68);g.fillStyle=STREET;g.fillRect(x-.13,y-.13,.26,.26);}}
// (edge-following wall of the first draft, now unused)
for(const e of edges){if(e.ring){const [a,b]=[e.pts[0],e.pts.at(-1)],nx=-(b[1]-a[1]),ny=b[0]-a[0];for(const t of [.25,.75])for(const s of [-.2,.2])dot(a[0]+(b[0]-a[0])*t+nx*s,a[1]+(b[1]-a[1])*t+ny*s,.085,'#6f8a5f');}
}
if(MOD){
  // a diagonal avenue cut through the grid, and an old country road the grid kept
  const cut=(pts,w,tr)=>{line(pts,w,'rgba(90,70,52,.55)');line(pts,w-.1,STREET);if(tr)for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]),nx=-(b[1]-a[1])/L,ny=(b[0]-a[0])/L;for(const s of [-.2,.2])dot((a[0]+b[0])/2+nx*s,(a[1]+b[1])/2+ny*s,.08,'#6f8a5f');}};
  cut(Array.from({length:70},(_,i)=>[OX-33+i*.56,OY+3.2-i*.42]),.72,true);
  cut(Array.from({length:40},(_,i)=>{const t=i/39;return [OX-RC-.4-t*24,OY+.3+t*9+Math.sin(t*9)*.6];}),.34,false);
  // railway into the station, bridges on the avenues
  const rail=Array.from({length:30},(_,i)=>[OX-8*STEP-i*.8,OY+3+i*.05]);line(rail,.16,'#3d2f24');g.setLineDash([.12,.22]);line(rail,.09,PAPER);g.setLineDash([]);
  for(const by of [OY,OY-4*STEP,OY+4*STEP]){const x=riverX(by);g.fillStyle='#b7a27f';g.fillRect(x-3.1,by-.3,6.2,.6);g.fillStyle=STREET;g.fillRect(x-3.1,by-.16,6.2,.32);}
}else{const x=riverX(OY);g.fillStyle='#b7a27f';g.fillRect(x-3,OY-.24,3.2,.48);} // a landing stage
// lettering
const label=(txt,x,y,s)=>{g.font=`italic ${s}px Georgia,serif`;g.textAlign='center';g.textBaseline='middle';g.lineWidth=s*.3;g.strokeStyle='rgba(246,239,220,.85)';g.strokeText(txt,x,y);g.fillStyle='#4a3828';g.fillText(txt,x,y);};
if(MOD){label('Old Town',OX+1,OY+3.2,1.5);label('New Town',OX-9,OY-9.5,1.5);label('St Anne',VX,VY+.2,1.05);label('The Works',OX+5.5,OY+13.5,1.2);label('Citadel Park',OX+11.5,OY-18.5,1.1);}
else{label('Market',OX+1,OY+.55,.5);label('St Mary',OX-1,OY-1.35,.45);label('Castle',OX+3,OY-6.3,.5);}
</script>
