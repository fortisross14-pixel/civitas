name: Extended simulation tests

# Slow campaigns and historical regression checks are deliberately manual.
# This workflow does not gate the Pages build or deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civitas-extended-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full regression and balance suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get sources
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run full suite
        run: npm run test:full
